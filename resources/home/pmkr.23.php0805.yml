version: '1'

stash:
    cores:
        '0805':
            dependencies:
                packages:
                    alpine-3: &cores_0805_dependencies_packages_alpine-3
                        autoconf: true
                        bison: true
                        findutils: true
                        g++: true
                        gcc: true
                        git: true
                        make: true
                        pkgconf: true
                        re2c: true
                    arch: &cores_0805_dependencies_packages_arch
                        autoconf: true
                        bison: true
                        findutils: true
                        gcc: true
                        git: true
                        make: true
                        pkgconf: true
                        re2c: true
                    fedora-35: &cores_0805_dependencies_packages_fedora-35
                        autoconf: true
                        bison: true
                        findutils: true
                        gcc: true
                        gcc-c++: true
                        git: true
                        make: true
                        re2c: true
                    opensuse-tumbleweed: &cores_0805_dependencies_packages_opensuse-tumbleweed
                        autoconf: true
                        bison: true
                        cmake: true
                        findutils: true
                        gawk: true
                        gcc: true
                        git: true
                        make: true
                        re2c: true
                    ubuntu-21-10: &cores_0805_dependencies_packages_ubuntu-21-10
                        autoconf: true
                        bison: true
                        cmake: true
                        findutils: true
                        g++: true
                        gcc: true
                        git: true
                        make: true
                        pkg-config: true
                        re2c: true
            etc:
                files:
                    ini: &cores_0805_etc_files_ini
                        php-gmagick-ini:
                            src: 'etc/php.gmagick.ini.twig'
                            dst: 'php.gmagick.ini'
                            vars:
                                extensions:
                                    igbinary:
                                        isEnabled: true
                                    imagick:
                                        isEnabled: true
                                    gmagick:
                                        isEnabled: true
                                    pcov:
                                        isEnabled: true
                                    pcntl:
                                        isEnabled: true
                                    posix:
                                        isEnabled: true
                                    readline:
                                        isEnabled: true
                        php-pcov-ini:
                            src: 'etc/php.pcov.ini.twig'
                            dst: 'php.pcov.ini'
                            vars:
                                extensions:
                                    igbinary:
                                        isEnabled: true
                                    imagick:
                                        isEnabled: true
                                    gmagick:
                                        isEnabled: false
                                    sockets:
                                        isEnabled: false
                                    openswoole:
                                        isEnabled: false
                                    swoole:
                                        isEnabled: false
                                    pcntl:
                                        isEnabled: true
                                    posix:
                                        isEnabled: true
                                    readline:
                                        isEnabled: true
                                    pcov:
                                        isEnabled: true
                                    xdebug:
                                        isEnabled: false
                        php-prod-ini:
                            src: 'etc/php.prod.ini.twig'
                            dst: 'php.prod.ini'
                            vars:
                                extensions:
                                    igbinary:
                                        isEnabled: true
                                    imagick:
                                        isEnabled: true
                                    gmagick:
                                        isEnabled: false
                                    sockets:
                                        isEnabled: false
                                    openswoole:
                                        isEnabled: false
                                    swoole:
                                        isEnabled: false
                                    pcntl:
                                        isEnabled: true
                                    posix:
                                        isEnabled: true
                                    readline:
                                        isEnabled: true
                                    pcov:
                                        isEnabled: false
                                    xdebug:
                                        isEnabled: false
                        php-xdebug-ini:
                            src: 'etc/php.xdebug.ini.twig'
                            dst: 'php.xdebug.ini'
                            vars:
                                extensions:
                                    igbinary:
                                        isEnabled: true
                                    imagick:
                                        isEnabled: true
                                    gmagick:
                                        isEnabled: false
                                    sockets:
                                        isEnabled: false
                                    openswoole:
                                        isEnabled: false
                                    swoole:
                                        isEnabled: false
                                    pcntl:
                                        isEnabled: true
                                    posix:
                                        isEnabled: true
                                    readline:
                                        isEnabled: true
                                    pcov:
                                        isEnabled: false
                                    xdebug:
                                        isEnabled: true
                        php-openswoole-ini:
                            src: 'etc/php.openswoole.ini.twig'
                            dst: 'php.openswoole.ini'
                            vars:
                                extensions:
                                    igbinary:
                                        isEnabled: true
                                    imagick:
                                        isEnabled: true
                                    gmagick:
                                        isEnabled: false
                                    sockets:
                                        isEnabled: true
                                    openswoole:
                                        isEnabled: true
                                    swoole:
                                        isEnabled: false
                                    pcntl:
                                        isEnabled: true
                                    posix:
                                        isEnabled: true
                                    readline:
                                        isEnabled: true
                                    pcov:
                                        isEnabled: false
                                    xdebug:
                                        isEnabled: true
                        php-swoole-ini:
                            src: 'etc/php.swoole.ini.twig'
                            dst: 'php.swoole.ini'
                            vars:
                                extensions:
                                    igbinary:
                                        isEnabled: true
                                    imagick:
                                        isEnabled: true
                                    gmagick:
                                        isEnabled: false
                                    sockets:
                                        isEnabled: true
                                    openswoole:
                                        isEnabled: false
                                    swoole:
                                        isEnabled: true
                                    pcntl:
                                        isEnabled: true
                                    posix:
                                        isEnabled: true
                                    readline:
                                        isEnabled: true
                                    pcov:
                                        isEnabled: false
                                    xdebug:
                                        isEnabled: true
                    ext: &cores_0805_etc_files_ext
                        conf-default-00-core-ini:
                            src: 'etc/ext/00-core.ini.twig'
                            dst: 'conf/default/00-core.ini'
                        conf-default-assert-ini:
                            src: 'etc/ext/assert.ini.twig'
                            dst: 'conf/default/assert.ini'
                        conf-default-cli_server-ini:
                            src: 'etc/ext/cli_server.ini.twig'
                            dst: 'conf/default/cli_server.ini'
                        conf-default-date-ini:
                            src: 'etc/ext/date.ini.twig'
                            dst: 'conf/default/date.ini'
                        conf-default-mail-ini:
                            src: 'etc/ext/mail.ini.twig'
                            dst: 'conf/default/mail.ini'
                    fpm: &cores_0805_etc_files_fpm
                        php-fpm-d-includes-00-pool-ini:
                            src: 'etc/php-fpm.d/includes/00-pool.ini.twig'
                            dst: 'php-fpm.d/includes/00-pool.ini'
                            vars:
                                envVars:
                                    LOCALHOST_NAME: '${stash.uname.n}'
                                    LOCAL_DEVELOPMENT: 'true'
                        php-fpm-d-includes-10-php-ini:
                            src: 'etc/php-fpm.d/includes/10-php.ini.twig'
                            dst: 'php-fpm.d/includes/10-php.ini'

                        php-fpm-d-pool-d-dev-default-ini:
                            src: 'etc/php-fpm.d/pool.d/dev.default.ini.twig'
                            dst: 'php-fpm.d/pool.d/dev.default.ini'
                        php-fpm-d-pool-d-gmagick-default-ini:
                            src: 'etc/php-fpm.d/pool.d/gmagick.default.ini.twig'
                            dst: 'php-fpm.d/pool.d/gmagick.default.ini'
                        php-fpm-d-pool-d-prod-default-ini:
                            src: 'etc/php-fpm.d/pool.d/prod.default.ini.twig'
                            dst: 'php-fpm.d/pool.d/prod.default.ini'

                        php-fpm-d-php-dev-ini:
                            src: 'etc/php-fpm.d/php.dev.ini.twig'
                            dst: 'php-fpm.d/php.dev.ini'
                            vars:
                                extensions:
                                    igbinary:
                                        isEnabled: true
                                    imagick:
                                        isEnabled: true
                                    gmagick:
                                        isEnabled: false
                                    pcov:
                                        isEnabled: false
                                    xdebug:
                                        isEnabled: true
                        php-fpm-d-php-gmagick-ini:
                            src: 'etc/php-fpm.d/php.gmagick.ini.twig'
                            dst: 'php-fpm.d/php.gmagick.ini'
                            vars:
                                extensions:
                                    igbinary:
                                        isEnabled: true
                                    imagick:
                                        isEnabled: false
                                    gmagick:
                                        isEnabled: true
                                    pcov:
                                        isEnabled: false
                                    xdebug:
                                        isEnabled: true
                        php-fpm-d-php-prod-ini:
                            src: 'etc/php-fpm.d/php.prod.ini.twig'
                            dst: 'php-fpm.d/php.prod.ini'
                            vars:
                                extensions:
                                    igbinary:
                                        isEnabled: true
                                    imagick:
                                        isEnabled: true
                                    gmagick:
                                        isEnabled: false
                                    pcov:
                                        isEnabled: false
                                    xdebug:
                                        isEnabled: false

                        php-fpm-d-php-fpm-dev-ini:
                            src: 'etc/php-fpm.d/php-fpm.dev.ini.twig'
                            dst: 'php-fpm.d/php-fpm.dev.ini'
                        php-fpm-d-php-fpm-gmagick-ini:
                            src: 'etc/php-fpm.d/php-fpm.gmagick.ini.twig'
                            dst: 'php-fpm.d/php-fpm.gmagick.ini'
                        php-fpm-d-php-fpm-prod-ini:
                            src: 'etc/php-fpm.d/php-fpm.prod.ini.twig'
                            dst: 'php-fpm.d/php-fpm.prod.ini'

                        supervisor-program-php-fpm-dev-ini:
                            src: 'etc/supervisor/program.php-fpm.ini.twig'
                            dst: 'supervisor/program.php-fpm.dev.ini'
                            vars:
                                iniVariant: 'dev'
                        supervisor-program-php-fpm-gmagick-ini:
                            src: 'etc/supervisor/program.php-fpm.ini.twig'
                            dst: 'supervisor/program.php-fpm.gmagick.ini'
                            vars:
                                iniVariant: 'gmagick'
                        supervisor-program-php-fpm-prod-ini:
                            src: 'etc/supervisor/program.php-fpm.ini.twig'
                            dst: 'supervisor/program.php-fpm.prod.ini'
                            vars:
                                iniVariant: 'prod'


extensions:
    igbinary-0805:
        downloader:
            type: 'git'
            options:
                url: 'https://github.com/thecaliskan/igbinary.git'
                refType: 'branch'
                refValue: 'php-8-5-tricky'
                branch: 'php-8-5-tricky'

    session-0805:
        configure:
            default:
                --enable-session: ~
        etc:
            files:
                conf/default/session-ini:
                    src: 'etc/ext/session-0805.ini.twig'
                    dst: 'conf/default/session.ini'

    pspell-0805:
        version: '1.0.1'
        configure:
            default:
                --enable-pspell: ~
        etc:
            files:
                conf/default/pspell-ini:
                    src: 'etc/ext/pspell.ini.twig'
                    dst: 'conf/default/pspell.ini'

    dom-0805:
        dependencies:
            packages:
                alpine-3:
                    libxml2-dev: true
                fedora-35:
                    libxml2: true
                    libxml2-devel: true
                opensuse-tumbleweed:
                    libxml2-2: true
                    libxml2-devel: true
                ubuntu-21-10:
                    libxml2: true
                    libxml2-dev: true
        configure:
            default:
                --enable-dom: ~
                --with-libxml: ~

    gd-0805:
        dependencies:
            packages:
                alpine-3:
                    libpng-dev: true
                    libavif-dev: true
                    libwebp-dev: true
                    libjpeg-turbo-dev: true
                    libxpm-dev: true
                    freetype-dev: true
                arch:
                    libavif: true
                    libpng: true
                    libwebp: true
                    libxpm: true
                    freetype2: true
                fedora-35:
                    libpng-devel: true
                    libwebp-devel: true
                    libjpeg-turbo-devel: true
                    libXpm-devel: true
                    freetype-devel: true
                opensuse-tumbleweed:
                    libfreetype6: true
                    freetype2-devel: true
                    libavif-devel: true
                    libjpeg8: true
                    libjpeg8-devel: true
                    libpng16-16: true
                    libpng16-compat-devel: true
                    libpng16-devel: true
                    libwebp7: true
                    libwebp-devel: true
                    libXpm4: true
                    libXpm-devel: true
                    zlib-devel: true
                ubuntu-21-10:
                    libavif-dev: true
                    libpng-dev: true
                    libwebp-dev: true
                    libjpeg-dev: true
                    libxpm-dev: true
                    libfreetype6-dev: true
        configure:
            default:
                --enable-gd: ~
                --with-webp: '/usr'
                --with-jpeg: '/usr'
                --with-libdir: 'lib/x86_64-linux-gnu'
                --with-freetype: '/usr'
                --with-xpm: '/usr'
                --with-avif: ~
        etc:
            files:
                conf/default/gd-ini:
                    src: 'etc/ext/gd.ini.twig'
                    dst: 'conf/default/gd.ini'

    libxml-0805:
        dependencies:
            packages:
                fedora-35:
                    libxml2: true
                    libxml2-devel: true
                opensuse-tumbleweed:
                    libxml2-devel: true
        configure:
            default:
                --with-libxml: ~

    snmp-0805:
        dependencies:
            packages:
                opensuse-tumbleweed:
                    net-snmp-devel: true
                ubuntu-22-04:
                    libsnmp-dev: true
        configure:
            default:
                --with-snmp: ~

    xdebug-0805:
        version: '3.5.0'
        configure:
            default:
                --enable-xdebug: ~
                #--enable-xdebug-dev: ~
                #--without-xdebug-compression: ~
        etc:
            files:
                conf/default/xdebug-ini:
                    src: 'etc/ext/xdebug.ini.twig'
                    dst: 'conf/default/xdebug.ini'

    swoole-0805:
        version: '6.0.0'
        weight: 30
        dependencies:
            extensions:
                sockets: true
            packages:
                ubuntu-22-04:
                    libc-ares2: true
                    libc-ares-dev: true
        configure:
            default:
                --enable-swoole: ~
                #--enable-debug-log: ~
                #--enable-trace-log: ~
                --enable-sockets: ~
                --enable-openssl: ~
                --enable-http2: ~
                #--enable-mysqlnd: ~
                #--enable-cares: ~
                #--with-openssl-dir: 'DIR'
                #--with-jemalloc-dir: 'DIR'
                #--enable-asan: ~
                #--enable-swoole-coverage: ~
                #--enable-swoole-dev: ~
                --enable-swoole-json: ~
                --enable-swoole-curl: ~
                #--enable-thread-context: ~
                #--enable-debug: ~
        etc:
            files:
                conf/default/swoole-ini:
                    src: 'etc/ext/swoole.ini.twig'
                    dst: 'conf/default/swoole.ini'

    ds-0805:
        version: '1.6.0'
        weight: 50
        configure:
            default:
                --enable-ds: ~


# Always enabled extensions, even with "--disable-all":
# [PHP Modules]
#   Core
#   date
#   hash
#   json
#   lexbor
#   pcre
#   random
#   Reflection
#   SPL
#   standard
#   uri
#   Zend OPcache
#
# [Zend Modules]
#   Zend OPcache
extensionSets:
    '0805':
        # region Enabled - core.
        openssl:
            status: 'enabled'
        curl:
            status: 'enabled'
        session-0805:
            status: 'enabled'
        phpdbg:
            status: 'enabled'
        opcache:
            status: 'skip'
            isEnabled: false
        gmp:
            status: 'enabled'
        bcmath:
            status: 'enabled'
        calendar:
            status: 'enabled'
        # @todo PHP 0805 - Extension - com_dotnet
        ctype:
            status: 'enabled'
        # @todo PHP 0805 - Extension - dba
        embed:
            status: 'enabled'
        fileinfo:
            status: 'enabled'
        filter:
            status: 'enabled'
        ftp:
            status: 'enabled'
        exif:
            status: 'enabled'
        gd-0805:
            status: 'enabled'
        iconv:
            status: 'enabled'
        intl:
            status: 'enabled'
        mbstring:
            status: 'enabled'
        enchant:
            status: 'enabled'
        gettext:
            status: 'enabled'
        pdo:
            status: 'enabled'
        sqlite3:
            status: 'enabled'
        pdo_sqlite:
            status: 'enabled'
        mysqlnd:
            status: 'enabled'
        mysqli:
            status: 'enabled'
        pdo_mysql:
            status: 'enabled'
        pgsql:
            status: 'enabled'
        pdo_pgsql:
            status: 'enabled'
        # @todo PHP 0805 - Extension - oci8.
        # @todo PHP 0805 - Extension - pdo_oci.
        # @todo PHP 0805 - Extension - pdo_dblib.
        # @todo PHP 0805 - Extension - pdo_firebird.
        # @todo PHP 0805 - Extension - pdo_odbc.
        phar:
            status: 'enabled'
        sodium:
            status: 'enabled'
        tokenizer:
            # NOTE: Can't be optional.
            # make: *** No rule to make target '/.../ext/tokenizer/Zend/zend_language_parser.y',
            # needed by '/.../ext/tokenizer/Zend/zend_language_parser.c'.
            status: 'enabled'
        libxml-0805:
            status: 'enabled'
        simplexml:
            status: 'enabled'
        xmlreader:
            status: 'enabled'
        xml:
            status: 'enabled'
        xmlwriter:
            status: 'enabled'
        xsl:
            status: 'enabled'
        dom-0805:
            status: 'enabled'
        zlib:
            status: 'enabled'
        bz2:
            status: 'enabled'
        zip:
            status: 'enabled'
        # endregion

        # region Enabled - 3th-party.
        # @todo PHP 0805 - Extension - igbinary.
        igbinary-0805:
            status: 'optional'
            isEnabled: true
        msgpack:
            status: 'enabled'
        zstd:
            status: 'enabled'
        # endregion

        # region Optional - core.
        ldap:
            # @todo PHP 0805 - Extension - LDAP.
            status: 'skip'
        pcntl:
            status: 'optional'
        posix:
            status: 'optional'
        readline:
            status: 'optional'
        snmp-0805:
            status: 'optional'
        shmop:
            status: 'optional'
        soap:
            status: 'optional'
        sockets:
            status: 'optional'
        sysvmsg:
            status: 'optional'
        sysvsem:
            status: 'optional'
        sysvshm:
            status: 'optional'
        tidy:
            status: 'optional'
        # endregion

        # region Optional - 3th-party.
        apcu:
            status: 'enabled'
        imagick:
            status: 'optional'
            isEnabled: false
        inotify:
            status: 'optional'
        maxminddb:
            status: 'optional'
        memcache:
            # @todo PHP 0805 - Extension - memcache.
            status: 'skip'
            isEnabled: false
        memcached:
            status: 'optional'
            isEnabled: true
        mongodb:
            status: 'optional'
        protobuf:
            status: 'optional'
        psr:
            status: 'optional'
        redis:
            status: 'optional'
            isEnabled: true
        pspell-0805:
            status: 'optional'
        sass:
            # @todo PHP 0805 - Extension - sass.
            status: 'skip'
            isEnabled: false
        ssh2:
            status: 'optional'
        swoole-0805:
            # @todo PHP 0805 - Extension - swoole.
            # In function ‘void swoole_php_treat_data(int, char*, zval*)’:
            #./thirdparty/php/main/SAPI.h:41:39: error: cannot convert ‘zend_string*’ {aka ‘_zend_string*’} to ‘char*’ in assignment
            #   41 |         separator = PG(arg_separator).input;
            #make: *** [Makefile:262: ext-src/swoole_http_request.lo] Error 1
            status: 'skip'
        xdebug:
            status: 'optional'
            isEnabled: false
        yaml:
            status: 'optional'
            isEnabled: true
        uploadprogress:
            status: 'optional'
        uuid:
            status: 'optional'
            isEnabled: true
        ds-0805:
            status: 'optional'
            isEnabled: false
        # endregion

        # region Skip - core.
        imap:
            # @todo
            #   error: utf8_mime2text() has new signature, but U8T_CANONICAL is missing.
            #   This should not happen. Check config.log for additional information.
            status: 'skip'
        # endregion

        # region Skip - 3th-party.
        pcov:
            # Compile fail with version "1.0.11".
            status: 'optional'
        openswoole:
            # @todo Wait for new release; Version 22.1.2 fails.
            # https://pecl.php.net/package/openswoole
            status: 'skip'
        # endregion


cores:
    '0805-nts':
        dependencies:
            packages:
                alpine-3:
                    <<: *cores_0805_dependencies_packages_alpine-3
                arch:
                    <<: *cores_0805_dependencies_packages_arch
                fedora-35:
                    <<: *cores_0805_dependencies_packages_fedora-35
                opensuse-tumbleweed:
                    <<: *cores_0805_dependencies_packages_opensuse-tumbleweed
                ubuntu-21-10:
                    <<: *cores_0805_dependencies_packages_ubuntu-21-10
        configure:
            default:
                --enable-fpm: ~
        etc:
            files:
                <<: *cores_0805_etc_files_ini
                <<: *cores_0805_etc_files_ext
                <<: *cores_0805_etc_files_fpm
    '0805-zts':
        dependencies:
            packages:
                alpine-3:
                    <<: *cores_0805_dependencies_packages_alpine-3
                arch:
                    <<: *cores_0805_dependencies_packages_arch
                fedora-35:
                    <<: *cores_0805_dependencies_packages_fedora-35
                opensuse-tumbleweed:
                    <<: *cores_0805_dependencies_packages_opensuse-tumbleweed
                ubuntu-21-10:
                    <<: *cores_0805_dependencies_packages_ubuntu-21-10
        configure:
            default:
                --enable-zts: ~
        etc:
            files:
                <<: *cores_0805_etc_files_ini
                <<: *cores_0805_etc_files_ext


instances:
    '080500-nts': &instance_080500
        hidden: true
        isZts: false
        coreVersion: '8.5.0'
        coreChecksum:
            hashAlgorithm: 'sha256'
            hashChecksum: 'cd16cb045b34a6cec6a83008e1b335f365c7a832fcc483df82308664c6d021f9'
    '080500-zts':
        isZts: true
        <<: *instance_080500
    '080500-nts-none':
        extensionSetNameSuffix: 'none'
        <<: *instance_080500

    '080501-nts': &instance_080501
        isZts: false
        coreVersion: '8.5.1'
        coreChecksum:
            hashAlgorithm: 'sha256'
            hashChecksum: '55f428c426e7241752ea9afff160bb64c32a9321cbd6d17d1c145b8df8823737'
    '080501-zts':
        isZts: true
        <<: *instance_080501
    '080501-nts-none':
        hidden: true
        extensionSetNameSuffix: 'none'
        <<: *instance_080501

aliases:
    '0805-nts': '080501-nts'
    '0805-zts': '080501-zts'


variations:
    '0805-nts-pcov':
        instanceKey: '0805-nts'
        phpRc: '{{ instance.shareDir }}/etc/php.pcov.ini'
    '0805-nts-gmagick':
        instanceKey: '0805-nts'
        phpRc: '{{ instance.shareDir }}/etc/php.gmagick.ini'
    '0805-nts-prod':
        instanceKey: '0805-nts'
        phpRc: '{{ instance.shareDir }}/etc/php.prod.ini'
    '0805-nts-xdebug':
        instanceKey: '0805-nts'
        phpRc: '{{ instance.shareDir }}/etc/php.xdebug.ini'
    '0805-nts-openswoole':
        instanceKey: '0805-nts'
        phpRc: '{{ instance.shareDir }}/etc/php.openswoole.ini'
    '0805-nts-swoole':
        instanceKey: '0805-nts'
        phpRc: '{{ instance.shareDir }}/etc/php.swoole.ini'
